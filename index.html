
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Love Surprise</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#ffd6e7,#ffe9d2);
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: #713b55;
}

.card {
  width: 90%;
  max-width: 380px;
  background: #fff8fb;
  border-radius: 25px;
  padding: 28px 20px;
  text-align: center;
  box-shadow: 0 10px 35px #b96c8840;
}

h2 { color: #e66c9c; }

.cartoons {
  font-size: 75px;
  margin: 20px 0;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  50% { transform: translateY(-10px); }
}

p {
  line-height: 1.8;
  font-size: 17px;
}

button {
  background: #ed76a4;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  font-size: 16px;
  margin-top: 15px;
  cursor: pointer;
}

#message {
  display: none;
  margin-top: 20px;
  background: #ffe6f0;
  border-radius: 15px;
  padding: 15px;
  animation: appear 1s;
}

@keyframes appear {
  from { opacity: 0; transform: scale(.8); }
  to { opacity: 1; transform: scale(1); }
}

.heart {
  position: fixed;
  bottom: -30px;
  animation: float 5s linear infinite;
  pointer-events: none;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h2>💗 A Little Surprise 💗</h2>

  <div class="cartoons">🐻💕🐰</div>

  <p>
    Hello! 🌸<br>
    မင်းအတွက် Surprise လေးတစ်ခုရှိတယ်။
  </p>

  <button onclick="showMessage()">
    Open My Surprise 💌
  </button>

  <div id="message">
    <h3>💖 Special Message 💖</h3>
    <p>
      မင်းရဲ့နေ့ရက်တိုင်းမှာ<br>
      ပျော်ရွှင်မှုလေးတွေ ပြည့်နေပါစေ။<br>
      အမြဲတမ်း ပြုံးနိုင်ပါစေ။ 🌷
    </p>
    <div style="font-size:35px">🐻💗🐰</div>
  </div>
</div>

<script>
function showMessage() {
  document.getElementById("message").style.display = "block";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random()*20) + "px";
  heart.style.animationDuration = (3 + Math.random()*3) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}

setInterval(createHeart, 600);
</script>

</body>
</html>
